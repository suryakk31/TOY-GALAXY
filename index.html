<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Galaxy Delivery Status</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a237e, #4a148c);
        }
        .delivery-status {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 700px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            position: relative;
        }
        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 20%;
            z-index: 1;
        }
        .status-round {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #e0e0e0;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            font-size: 24px;
            color: #fff;
        }
        .status-item.active .status-round {
            animation: pulse 1.5s infinite;
        }
        .status-item span {
            font-size: 12px;
            text-align: center;
            color: #333;
            font-weight: bold;
        }
        .progress-bar {
            position: absolute;
            top: 25px;
            left: 0;
            height: 4px;
            background-color: #e0e0e0;
            width: 100%;
        }
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00c853, #18ffff);
            width: 0;
            transition: width 1s ease-in-out;
            box-shadow: 0 0 10px rgba(0, 200, 83, 0.5);
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(255, 255, 255, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .toy-icon {
            font-size: 32px;
            margin-right: 10px;
            vertical-align: middle;
        }
        #pending .status-round { background-color: #ff9800; }
        #confirmed .status-round { background-color: #2196f3; }
        #shipped .status-round { background-color: #9c27b0; }
        #out-for-delivery .status-round { background-color: #ff4081; }
        #delivered .status-round { background-color: #00c853; }
    </style>
</head>
<body>
    <div class="delivery-status">
        
        <div class="status-bar" id="statusBar">
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="status-item" id="pending">
                <div class="status-round"><i class="fas fa-hourglass-start"></i></div>
                <span>Pending</span>
            </div>
            <div class="status-item" id="confirmed">
                <div class="status-round"><i class="fas fa-check-circle"></i></div>
                <span>Confirmed</span>
            </div>
            <div class="status-item" id="shipped">
                <div class="status-round"><i class="fas fa-rocket"></i></div>
                <span>Shipped</span>
            </div>
            <div class="status-item" id="out-for-delivery">
                <div class="status-round"><i class="fas fa-truck"></i></div>
                <span>Out for Delivery</span>
            </div>
            <div class="status-item" id="delivered">
                <div class="status-round"><i class="fas fa-gift"></i></div>
                <span>Delivered</span>
            </div>
        </div>
    </div>

    <script>
        const statusBar = document.getElementById('statusBar');
        const progress = document.getElementById('progress');
        const statuses = ['pending', 'confirmed', 'shipped', 'out-for-delivery', 'delivered'];
        let currentStatus = 0;

        function updateStatus() {
            if (currentStatus < statuses.length) {
                const statusItem = document.getElementById(statuses[currentStatus]);
                statusItem.classList.add('active');
                progress.style.width = `${(currentStatus / (statuses.length - 1)) * 100}%`;
                currentStatus++;
                setTimeout(updateStatus, 2000);
            }
        }

        updateStatus();
    </script>
</body>
</html>
